<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東京・富士・箱根 九日｜2026/12/21–12/29</title>
<meta name="description" content="2026 年 12 月日本九日行程：成田、淺草、河口湖、御殿場、箱根、川越的每日時間表與交通花費。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F7F5; --surface:#FFFFFF; --ink:#1C2A39; --mist:#5B6875; --rule:#D3DAD7;
  --ticket:#E2F0E6; --ticket-line:#D3E7DA; --ticket-edge:#9CC3A8; --stamp:#C23B22;
  --ic:#2E8754; --buy:#B07A0C; --pass:#1E5DA6; --free:#8A949E; --focus:#1E5DA6; --on-stamp:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#10161C; --surface:#161E26; --ink:#E3EAEE; --mist:#9AA7B2; --rule:#2B353F;
    --ticket:#1A2A21; --ticket-line:#203328; --ticket-edge:#3F6A4F; --stamp:#E7735C;
    --ic:#52B57D; --buy:#D9A440; --pass:#6EA2E2; --free:#7F8A94; --focus:#6EA2E2; --on-stamp:#10161C;
  }
}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.75}
a{color:var(--pass);text-underline-offset:3px}
a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
h2,h3{line-height:1.3}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 96px}
.num{font-variant-numeric:tabular-nums}

/* 封面 */
.hero{padding:56px 0 8px}
.hero h1{margin:0;font-size:clamp(30px,8.4vw,56px);line-height:1.12;font-weight:900;letter-spacing:.05em}
.hero h1 span,.hero .dates span{white-space:nowrap}
.hero .dates{margin:14px 0 0;font-size:20px;font-weight:500}
.hero .base{margin:2px 0 0;color:var(--mist)}
.countdown{margin:10px 0 0;font-size:15px;color:var(--mist)}

/* 九天路線 */
.line{list-style:none;margin:28px 0 0;padding:0}
.line li{position:relative;padding-left:30px}
.line li::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:3px;background:var(--ink)}
.line li:first-child::before{top:50%}
.line li:last-child::before{bottom:50%}
.line li::after{content:"";position:absolute;left:1px;top:50%;width:15px;height:15px;margin-top:-7.5px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}
.line li.out::after{border-color:var(--buy)}
.line li.is-today::after{background:var(--stamp);border-color:var(--stamp)}
.line a{display:flex;gap:14px;align-items:baseline;padding:6px 0;color:inherit;text-decoration:none}
.line a:hover .pl{text-decoration:underline;text-underline-offset:3px}
.line .d{font-weight:700;min-width:2.1em}
.line .dt{color:var(--mist);min-width:6.4em;font-feature-settings:"halt"}
.line .pl{font-weight:500;word-break:keep-all}
@media (min-width:720px){
  .line{display:grid;grid-template-columns:repeat(9,1fr)}
  .line li{padding:30px 0 0;text-align:center}
  .line li::before{left:0;right:0;top:10px;bottom:auto;width:auto;height:3px}
  .line li:first-child::before{left:50%;top:10px}
  .line li:last-child::before{right:50%;bottom:auto}
  .line li::after{left:50%;top:11px;margin-left:-7.5px}
  .line a{flex-direction:column;align-items:center;gap:0;padding:0 2px}
  .line .d,.line .dt{min-width:0}
  .line .dt{font-size:14px}
  .line .pl{font-size:14px;line-height:1.4}
}

/* 圖例 */
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;margin:28px 0 0;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:14px;color:var(--mist)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c)}
.sw.ring{background:var(--surface);border:3px solid var(--buy)}
.sw.tk{width:22px;height:14px;border-radius:3px;background:var(--ticket);border:1px solid var(--ticket-edge)}
.sw.dash{width:22px;height:14px;border-radius:3px;border:1.5px dashed var(--mist)}

/* 每一天 */
.day{margin-top:72px;scroll-margin-top:16px}
.sign{background:var(--surface);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.sign-main{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px 16px;padding:18px 20px 16px}
.badge{display:grid;place-items:center;align-content:center;width:54px;height:54px;border:3px solid var(--ink);border-radius:12px;line-height:1}
.badge small{font-size:13px;font-weight:700}
.badge b{font-size:24px;font-weight:900;margin-top:1px}
.day.out .badge{border-color:var(--buy)}
.sign h2{margin:0;font-size:clamp(26px,6vw,38px);font-weight:900;letter-spacing:.08em;line-height:1.15}
.sign-date{grid-column:2;color:var(--mist);font-size:15px}
.sign-band{display:flex;justify-content:space-between;gap:16px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:500;padding:6px 16px}
.sign-band .prev::before{content:"◀\00a0"}
.sign-band .next::after{content:"\00a0▶"}
.sign-band a{color:inherit;text-decoration:none}
.sign-band a:hover{text-decoration:underline;text-underline-offset:3px}
.sign-band a:focus-visible{outline-color:var(--paper)}
.lead{margin:18px 0 6px;font-size:17px}
.jump{font-size:15px;margin:0 0 6px}

.plan{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--rule)}
.plan>li{display:grid;grid-template-columns:100px 1fr;gap:2px 16px;padding:12px 0;border-bottom:1px solid var(--rule)}
.time{color:var(--mist);font-size:15px;font-variant-numeric:tabular-nums;padding-top:1px}
.what{margin:0}
.chip{display:inline-block;margin-left:8px;padding:0 8px;border:1px solid var(--rule);border-radius:999px;font-size:12px;line-height:1.75;color:var(--mist);vertical-align:2px;white-space:nowrap}
.note{margin:2px 0 0;font-size:14px;color:var(--mist)}
.maplink{font-size:14px;margin-left:8px;white-space:nowrap}
.slot{display:block;border:1.5px dashed var(--rule);border-radius:4px;padding:5px 12px;color:var(--mist);font-size:15px}
.ride .what::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c,var(--ink));margin-right:9px;vertical-align:1px}
.ride .route-txt{font-weight:500}
.plan>li.ticket-row{display:block;padding:14px 0}

/* 車票 */
.ticket{display:grid;grid-template-columns:1fr 116px;border-radius:6px;background-color:var(--ticket);background-image:repeating-linear-gradient(-45deg,transparent 0 9px,var(--ticket-line) 9px 10px);border:1px solid var(--ticket-edge)}
.t-main{padding:14px 18px 15px;min-width:0}
.t-route{font-weight:700;font-size:17px;letter-spacing:.04em}
.t-route .to{color:var(--mist);font-weight:400;margin:0 8px}
.t-times{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin:4px 0 2px;font-family:"DotGothic16","Noto Sans TC",monospace;font-size:40px;line-height:1.15;letter-spacing:.02em}
.t-times small{font-family:"Noto Sans TC",sans-serif;font-size:14px;color:var(--mist);letter-spacing:0;margin-right:6px}
.t-times small.after{margin:0 0 0 6px}
.t-name{font-size:15px;font-weight:500}
.t-check{margin-top:4px;font-size:13px;color:var(--mist)}
.t-stub{position:relative;border-left:2px dashed var(--ticket-edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px 6px}
.t-stub::before,.t-stub::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--paper)}
.t-stub::before{top:-9px}
.t-stub::after{bottom:-9px}
.t-price{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.t-price small{display:block;text-align:center;font-size:12px;font-weight:400;color:var(--mist)}
.stamp{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;border:2px solid var(--sc);color:var(--sc);font-weight:900;font-size:13px;letter-spacing:.05em;transform:rotate(-10deg)}
@media (max-width:480px){
  .plan>li{grid-template-columns:78px 1fr;gap:2px 12px}
  .ticket{grid-template-columns:1fr 94px}
  .t-main{padding:12px 14px}
  .t-times{font-size:32px}
  .stamp{width:54px;height:54px;font-size:12px}
}

/* 當天交通 */
.costs{margin-top:22px;padding:16px 18px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:3px}
.costs h3{margin:0 0 4px;font-size:16px}
.cost{list-style:none;margin:0;padding:0}
.cost li{display:grid;grid-template-columns:1fr auto;gap:0 16px;padding:9px 0;border-bottom:1px dashed var(--rule)}
.cost .leg{font-weight:500}
.cost .leg::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px;vertical-align:1px}
.cost .how{grid-column:1;font-size:14px;color:var(--mist)}
.cost .amt{grid-column:2;grid-row:1 / span 2;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.cost .amt small{display:block;font-size:12px;font-weight:400;color:var(--mist)}
.sum{display:flex;justify-content:space-between;gap:16px;padding-top:10px;font-weight:700;font-variant-numeric:tabular-nums}
.extra,.cost-note{margin:8px 0 0;font-size:14px;color:var(--mist)}

/* 區塊標題 */
.block{margin-top:80px;scroll-margin-top:16px}
.block>h2{margin:0;font-size:clamp(24px,5vw,30px);font-weight:900;letter-spacing:.06em}
.block>.lead{margin-top:10px}
.block h3{font-size:18px;margin:36px 0 8px}

/* 富士・箱根路線圖 */
.route{list-style:none;margin:20px 0 0;padding:0}
.route li{display:grid;grid-template-columns:96px 28px 1fr;column-gap:12px}
.route .rt{text-align:right;color:var(--mist);font-size:15px;font-variant-numeric:tabular-nums;padding-top:1px}
.route .rl{position:relative}
.route .rl::before{content:"";position:absolute;left:12px;top:16px;bottom:-4px;width:5px;background:var(--seg,transparent)}
.route .rl::after{content:"";position:absolute;left:6px;top:6px;width:17px;height:17px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);box-sizing:border-box}
.route li.stay .rl::after{border-radius:3px;background:var(--ink)}
.route li.key .rl::after{border-color:var(--stamp)}
.route .rn{padding:0 0 16px}
.route .rn strong{font-weight:700}
.route .rv{display:block;font-size:14px;color:var(--mist)}
.route li.dayhead{display:block;margin:6px 0 10px;padding-left:148px;font-weight:700;color:var(--mist);font-size:14px}
@media (max-width:480px){
  .route li{grid-template-columns:62px 26px 1fr;column-gap:10px}
  .route li.dayhead{padding-left:108px}
}

.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.rows li{display:grid;grid-template-columns:1fr auto;gap:0 16px;padding:11px 0;border-bottom:1px solid var(--rule)}
.rows .a{font-weight:700}
.rows .b{grid-column:1;font-size:14px;color:var(--mist)}
.rows .c{grid-column:2;grid-row:1 / span 2;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.rows .c small{display:block;font-size:12px;font-weight:400;color:var(--mist)}
.why{margin:14px 0 0}

.check{list-style:none;margin:0;padding:0}
.check li{border-bottom:1px solid var(--rule)}
.check label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer}
.check input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--ic);flex:none}
.check input:checked+span{color:var(--mist);text-decoration:line-through}
.tz{font-size:14px;color:var(--mist);margin:8px 0 0}


/* 預算表 */
.budget{width:100%;border-collapse:collapse;margin-top:16px;font-variant-numeric:tabular-nums}
.budget th,.budget td{padding:9px 6px;border-bottom:1px solid var(--rule);text-align:left;font-weight:400}
.budget td:last-child,.budget th:last-child{text-align:right}
.budget thead th{font-size:14px;color:var(--mist)}
.budget tfoot td{font-weight:700;border-bottom:none;border-top:2px solid var(--ink)}

/* 餐廳、住宿 */
.list{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--rule)}
.list li{padding:14px 0;border-bottom:1px solid var(--rule)}
.list .a{font-weight:700;margin:0}
.list p{margin:2px 0 0;font-size:15px}
.list .m{color:var(--mist);font-size:14px}
.list li.blank{color:var(--mist)}

.notes{margin:12px 0 0;padding-left:1.2em}
.notes li{margin:6px 0}
.src{margin:12px 0 0;padding-left:1.4em;font-size:14px}
.src li{margin:4px 0}
footer{margin-top:80px;padding-top:24px;border-top:1px solid var(--rule);font-size:15px;color:var(--mist)}
footer h2{font-size:18px;color:var(--ink);margin:0 0 8px}
footer code{font-size:14px;background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:0 5px}

.quick{display:flex;flex-wrap:wrap;gap:4px 20px;margin:14px 0 0;font-size:15px}
.today-jump{position:fixed;right:16px;bottom:16px;background:var(--stamp);color:var(--on-stamp);padding:10px 18px;border-radius:999px;text-decoration:none;font-weight:700;font-size:15px}
.day.is-today .sign{border-color:var(--stamp);box-shadow:0 0 0 2px var(--stamp)}

@media print{
  body{background:#fff}
  .today-jump{display:none}
  .day,.block{break-inside:avoid-page}
}
</style>
</head>
<body>
<main class="wrap" id="app">
  <noscript><p>這一頁需要開啟 JavaScript 才能顯示行程。</p></noscript>
</main>

<script>
/* =====================================================================
   在這裡修改行程
   ---------------------------------------------------------------------
   每天的 plan 是時間表，每一列可以是：
     一般行程 { t: "時間", what: "做什麼", tag: "指定" | "建議", note: "補充", map: "地圖搜尋字" }
     待填格子 { t: "時間", tag: "待填", hint: "要填什麼" }      ← 填好後把 tag 改成「指定」並加上 what
     一般乘車 { ride: { dep: "出發時間", from: "起點", to: "終點", name: "車種與轉乘", pay: "ic" } }
     重要班次 { ride: { key: true, dep: "08:30", arr: "10:26", from, to, name, price: 4200, stamp: "book" } }
              key: true 會用車票樣式凸顯；stamp 可填 book（要預約）／pass（周遊券）／ic（西瓜卡）
   每天的 cost 是當天交通花費，yen 改了之後，每日小計、三天合計和總預算都會自動重算。
   pay 的種類：ic 西瓜卡、buy 單買或預約的車票、pass 箱根周遊券、free 免費或已包含
   ===================================================================== */
const TRIP = {
  title: "東京・富士・箱根 九日",
  home: "台灣",
  start: "2026-12-21",
  end: "2026-12-29",
  base: "以淺草為據點，12/22–12/24 走富士・箱根一圈。",

  pay: {
    ic:   { label: "西瓜卡",        color: "var(--ic)" },
    buy:  { label: "單買／預約車票", color: "var(--buy)" },
    pass: { label: "箱根周遊券",    color: "var(--pass)" },
    free: { label: "免費／已包含",   color: "var(--free)" }
  },

  days: [
    {
      id: "d1", date: "2026-12-21", short: "成田・淺草", out: true,
      sign: "成田", stay: "淺草",
      lead: "中午落地，把大行李交給機場的當日配送，空手去成田山，晚上到淺草入住。",
      plan: [
        { t: "12:00", what: "抵達成田機場（航班：＿＿＿＿，第＿航廈）", tag: "指定" },
        { t: "12:00–13:15", what: "入境、領行李；設定好西瓜卡", tag: "建議" },
        { t: "13:15–13:45", what: "到達大廳的 SAGAWA 櫃台，把大行李寄到淺草飯店", tag: "建議",
          note: "當日配送 14:00 截止收件；三邊合計 140 cm 內一件 ¥2,840，飯店要能代收。" },
        { ride: { dep: "約 13:50", from: "成田機場", to: "京成成田", name: "京成本線快速，10 分", pay: "ic" } },
        { t: "14:10–16:00", what: "成田山新勝寺：大本堂、三重塔、成田山公園", tag: "指定",
          note: "參拜時間 8:00–16:00；從京成成田站走路約 10 分。", map: "成田山新勝寺" },
        { t: "16:00–17:00", what: "成田山表參道：吃鰻魚、逛老街", tag: "建議",
          note: "參道約 800 公尺、150 多家店；16:30 左右天黑。", map: "成田山表参道" },
        { ride: { dep: "約 17:10", from: "京成成田", to: "淺草", name: "京成本線快速到青砥轉車，經押上進都營淺草線，約 1 小時 12 分", pay: "ic" } },
        { t: "18:30", what: "入住 HOTEL AMANEK 淺草站前（行李已送到）", tag: "指定", map: "HOTEL AMANEK 浅草駅前" },
        { t: "19:00–", tag: "待填", hint: "晚餐" }
      ],
      cost: [
        { leg: "成田機場 → 京成成田", how: "京成本線快速，10 分", yen: 272, pay: "ic" },
        { leg: "京成成田 → 淺草", how: "京成本線快速，青砥轉車，經押上到淺草，約 1 小時 12 分", yen: 974, pay: "ic" }
      ],
      extra: [ { what: "行李當日配送（SAGAWA，140 cm 內）", yen: 2840, per: "件" } ]
    },
    {
      id: "d2", date: "2026-12-22", short: "河口湖", out: true,
      sign: "河口湖", stay: "河口湖 富士吟景",
      lead: "早上從新宿搭富士回遊，中午前到河口湖，下午逛湖畔，傍晚請飯店來接。",
      plan: [
        { t: "07:00", what: "早餐；大行李寄放在 Amanek，12/24 晚上回來再拿", tag: "建議", note: "出發前先寫信跟飯店確認。" },
        { ride: { dep: "07:40", from: "淺草", to: "新宿", name: "銀座線到神田，轉 JR 中央線快速，28 分；到新宿留 20 分鐘找月台", pay: "ic" } },
        { ride: { key: true, dep: "08:30", arr: "10:26", from: "新宿", to: "河口湖", name: "富士回遊 7 號（全車指定）",
                  price: 4200, stamp: "book", check: "11/22（日）09:00 開賣（台灣時間）" } },
        { t: "10:30–11:30", what: "河口湖站買周遊巴士 2 日券；午餐吃餺飥（ほうとう）", tag: "建議" },
        { t: "11:30–15:30", what: "湖畔觀光：河口湖全景纜車、大石公園看富士山、久保田一竹美術館", tag: "建議",
          note: "全景纜車往返 ¥1,200；12/7–12/18 檢修停駛，12/22 已恢復。", map: "富士山パノラマロープウェイ" },
        { t: "", tag: "待填", hint: "其他想去的地方" },

/* ===================== 以下是畫面程式，一般不用改 ===================== */
const WEEK = ["日", "一", "二", "三", "四", "五", "六"];
const STAMP = { book: ["要預約", "var(--stamp)"], pass: ["周遊券", "var(--pass)"], ic: ["西瓜卡", "var(--ic)"] };

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false || kid === "") continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const yen = n => "¥" + Number(n).toLocaleString("en-US");
const mapUrl = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const payColor = p => (TRIP.pay[p] || TRIP.pay.free).color;
const payLabel = p => (TRIP.pay[p] || TRIP.pay.free).label;
const sumCost = d => (d.cost || []).reduce((s, c) => s + (Number(c.yen) || 0), 0);
function md(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return { y, m, d, w: WEEK[new Date(Date.UTC(y, m - 1, d)).getUTCDay()] };
}
const shortDate = iso => { const x = md(iso); return `${x.m}/${x.d}（${x.w}）`; };
const longDate = iso => { const x = md(iso); return `${x.m} 月 ${x.d} 日（${x.w}）`; };
function todayInJapan() {
  try {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  } catch (e) { return new Date().toISOString().slice(0, 10); }
}
const dayNo = id => TRIP.days.findIndex(d => d.id === id) + 1;

function renderHero(today) {
  const days = TRIP.days.length;
  let count = null;
  const diff = Math.round((Date.parse(TRIP.start) - Date.parse(today)) / 864e5);
  if (diff > 0) count = `距離出發還有 ${diff} 天。`;
  const wbr = s => s.split("・").flatMap((p, k) => k ? ["・", h("wbr"), p] : [p]);
  return h("header", { class: "hero" },
    h("h1", null, TRIP.title.split(" ").flatMap((p, k) => k ? [" ", h("span", null, p)] : [h("span", null, p)])),
    h("p", { class: "dates num" }, `${shortDate(TRIP.start)}至 ${shortDate(TRIP.end)}，`, h("span", null, `${days} 天 ${days - 1} 夜`)),
    h("p", { class: "base" }, TRIP.base),
    count && h("p", { class: "countdown" }, count),
    h("nav", { "aria-label": "九天行程" },
      h("ol", { class: "line" },
        TRIP.days.map((d, i) => h("li", { class: [d.out ? "out" : "", d.date === today ? "is-today" : ""].join(" ").trim() || null },
          h("a", { href: "#" + d.id },
            h("span", { class: "d" }, "D" + (i + 1)),
            h("span", { class: "dt num" }, shortDate(d.date)),
            h("span", { class: "pl" }, wbr(d.short)))))))
  );
}

function renderLegend() {
  const sw = (c, extra) => h("span", { class: "sw" + (extra ? " " + extra : ""), style: c ? `--c:${c}` : null, "aria-hidden": "true" });
  return h("div", { class: "legend" },
    h("span", null, sw(null, "tk"), "要準時搭的班次"),
    h("span", null, h("span", { class: "chip", style: "margin:0" }, "建議"), "建議安排，可以換掉"),
    h("span", null, sw(null, "dash"), "自己填"),
    h("span", null, "沒有標記的是已確定的行程"),
    h("span", null, sw(null, "ring"), "離開東京市區的日子"),
    Object.keys(TRIP.pay).map(k => h("span", null, sw(payColor(k)), payLabel(k)))
  );
}

function renderQuick() {
  return h("nav", { class: "quick", "aria-label": "頁面捷徑" },
    h("a", { href: "#excursion" }, "離開市區的交通"),
    h("a", { href: "#budget" }, "九天交通費"),
    h("a", { href: "#food" }, "想吃的餐廳"),
    h("a", { href: "#hotels" }, "住宿"),
    h("a", { href: "#notes" }, "出發前要知道"));
}

function renderTicket(r) {
  const st = STAMP[r.stamp] || null;
  return h("div", { class: "ticket" },
    h("div", { class: "t-main" },
      h("div", { class: "t-route" }, r.from, h("span", { class: "to", "aria-hidden": "true" }, "→"), h("span", { class: "vh" }, "到"), r.to),
      h("div", { class: "t-times num" },
        h("span", null, h("small", null, "發"), r.dep),
        r.arr && h("span", null, h("small", null, "到"), r.arr, r.arrApprox && h("small", { class: "after" }, "左右"))),
      h("div", { class: "t-name" }, r.name),
      r.check && h("div", { class: "t-check" }, r.check)),
    h("div", { class: "t-stub" },
      r.price != null
        ? h("div", { class: "t-price" }, yen(r.price), r.priceNote && h("small", null, r.priceNote))
        : r.priceText && h("div", { class: "t-price" }, r.priceText),
      st && h("div", { class: "stamp", style: `--sc:${st[1]}` }, st[0]))
  );
}

function renderRow(it) {
  if (it.ride && it.ride.key) return h("li", { class: "ticket-row" }, renderTicket(it.ride));
  if (it.ride) {
    const r = it.ride;
    return h("li", { class: "ride", style: `--c:${payColor(r.pay)}` },
      h("div", { class: "time" }, r.dep || ""),
      h("div", null,
        h("p", { class: "what" }, h("span", { class: "route-txt" }, `${r.from} → ${r.to}`), "　", r.name)));
  }
  if (it.tag === "待填" && !it.what) {
    return h("li", { class: "todo" },
      h("div", { class: "time" }, it.t || ""),
      h("div", null, h("span", { class: "slot" }, "自己填：" + (it.hint || ""))));
  }
  return h("li", null,
    h("div", { class: "time" }, it.t || ""),
    h("div", null,
      h("p", { class: "what" }, it.what || "",
        it.tag === "建議" && h("span", { class: "chip" }, "建議"),
        it.map && h("a", { class: "maplink", href: mapUrl(it.map), target: "_blank", rel: "noopener" }, "地圖")),
      it.note && h("p", { class: "note" }, it.note)));
}

function renderCosts(d, title) {
  return h("div", { class: "costs" },
    h("h3", null, title || "當天交通"),
    h("ul", { class: "cost" },
      d.cost.map(c => h("li", { style: `--c:${payColor(c.pay)}` },
        h("span", { class: "leg" }, c.leg),
        h("span", { class: "amt" }, (c.approx ? "約 " : "") + yen(c.yen), h("small", null, payLabel(c.pay))),
        h("span", { class: "how" }, c.how)))),
    h("div", { class: "sum" }, h("span", null, "當天合計（每人）"), h("span", null, yen(sumCost(d)))),
    (d.extra || []).map(x => h("p", { class: "extra" }, `另計（需要才用）：${x.what} ${yen(x.yen)}／${x.per || "次"}`)),
    d.note && h("p", { class: "cost-note" }, d.note));
}

function renderDay(d, i, today) {
  const ex = TRIP.excursion.days.includes(d.id);
  const prev = TRIP.days[i - 1], next = TRIP.days[i + 1];
  return h("section", { class: ["day", d.out ? "out" : "", d.date === today ? "is-today" : ""].join(" ").trim(), id: d.id, "aria-labelledby": d.id + "-h" },
    h("header", { class: "sign" },
      h("div", { class: "sign-main" },
        h("div", { class: "badge", "aria-hidden": "true" }, h("small", null, "D"), h("b", null, String(i + 1))),
        h("h2", { id: d.id + "-h" }, h("span", { class: "vh" }, `D${i + 1} `), d.sign),
        h("div", { class: "sign-date num" }, longDate(d.date) + (d.stay ? `，住${d.stay}` : ""))),
      h("nav", { class: "sign-band", "aria-label": "前一天與後一天" },
        prev ? h("a", { class: "prev", href: "#" + prev.id }, prev.sign) : h("span", { class: "prev" }, TRIP.home),
        next ? h("a", { class: "next", href: "#" + next.id }, next.sign) : h("span", { class: "next" }, TRIP.home))),
    h("p", { class: "lead" }, d.lead),
    ex && h("p", { class: "jump" }, h("a", { href: "#excursion" }, "富士・箱根三天的路線與票券總覽")),
    h("ol", { class: "plan" }, d.plan.map(renderRow)),
    renderCosts(d));
}

function renderExcursion() {
  const ex = TRIP.excursion;
  const ds = ex.days.map(id => TRIP.days.find(d => d.id === id));
  const total = ds.reduce((s, d) => s + sumCost(d), 0);
  const first = ds[0], last = ds[ds.length - 1];
  let stored = {};
  try { stored = JSON.parse(localStorage.getItem("trip2026-checklist") || "{}"); } catch (e) { stored = {}; }
  const save = () => { try { localStorage.setItem("trip2026-checklist", JSON.stringify(stored)); } catch (e) {} };

  const others = TRIP.days.filter(d => d.out && !ex.days.includes(d.id));
  return h("section", { class: "block", id: "excursion", "aria-labelledby": "excursion-h" },
    h("h2", { id: "excursion-h" }, "離開東京市區的交通"),
    h("p", { class: "lead" }, `重點是 ${shortDate(first.date)}到 ${shortDate(last.date)}的富士・箱根三天，交通費每人 ${yen(total)}，含淺草和新宿之間的兩段地鐵。` +
      (others.length > 0 ? `${others.map(d => d.sign).join("和")}的交通放在這一段最後。` : "")),
    h("h3", null, "富士・箱根三天的路線"),
    h("ol", { class: "route" },
      ex.route.map(s => s.head
        ? h("li", { class: "dayhead" }, s.head)
        : h("li", { class: [s.stay ? "stay" : "", s.key ? "key" : ""].join(" ").trim() || null },
            h("div", { class: "rt" }, s.time || ""),
            h("div", { class: "rl", style: s.pay ? `--seg:${payColor(s.pay)}` : null, "aria-hidden": "true" }),
            h("div", { class: "rn" }, h("strong", null, s.name), s.via && h("span", { class: "rv" }, `${s.via}（${s.payText || payLabel(s.pay)}）`))))),
    h("h3", null, "要買的票"),
    h("ul", { class: "rows" },
      ex.tickets.map(t => h("li", null,
        h("span", { class: "a" }, t.name),
        h("span", { class: "c" }, yen(t.yen)),
        h("span", { class: "b" }, `${t.when}；${t.where}`)))),
    h("p", { class: "why" }, ex.why),
    h("h3", null, "預訂清單"),
    h("ul", { class: "check" },
      ex.checklist.map(c => h("li", null,
        h("label", null,
          h("input", { type: "checkbox", checked: stored[c] ? true : null, onchange: e => { stored[c] = e.target.checked; save(); } }),
          h("span", null, c))))),
    h("p", { class: "tz" }, "時間都是台灣時間（日本快一小時）。勾選只存在這台裝置的瀏覽器裡。"),
    others.length > 0 && h("h3", null, others.map(d => d.sign).join("和")),
    others.length > 0 && h("ul", { class: "rows" },
      others.map(d => h("li", null,
        h("a", { class: "a", href: "#" + d.id }, `D${dayNo(d.id)} ${d.sign}，${shortDate(d.date)}`),
        h("span", { class: "c" }, yen(sumCost(d))),
        h("span", { class: "b" },
          d.cost.map(c => `${c.leg} ${yen(c.yen)}`).join("；") +
          `（${[...new Set(d.cost.map(c => payLabel(c.pay)))].join("、")}）`)))));
}

function renderBudget() {
  const total = TRIP.days.reduce((s, d) => s + sumCost(d), 0);
  const extras = TRIP.days.flatMap(d => (d.extra || []).map(x => `${shortDate(d.date)}${x.what} ${yen(x.yen)}／${x.per || "次"}`));
  return h("section", { class: "block", id: "budget", "aria-labelledby": "budget-h" },
    h("h2", { id: "budget-h" }, "九天交通費"),
    h("p", { class: "lead" }, `每人約 ${yen(total)}，不含行李配送。`),
    h("table", { class: "budget" },
      h("thead", null, h("tr", null, h("th", null, "日期"), h("th", null, "行程"), h("th", null, "交通費"))),
      h("tbody", null, TRIP.days.map((d, i) => h("tr", null,
        h("td", null, `D${i + 1} ${shortDate(d.date)}`),
        h("td", null, h("a", { href: "#" + d.id }, d.short)),
        h("td", null, yen(sumCost(d)))))),
      h("tfoot", null, h("tr", null, h("td", { colspan: "2" }, "合計（每人）"), h("td", null, yen(total))))),
    extras.length > 0 && h("p", { class: "extra" }, "需要才用的費用：" + extras.join("；") + "。"));
}

function renderRestaurants() {
  return h("section", { class: "block", id: "food", "aria-labelledby": "food-h" },
    h("h2", { id: "food-h" }, "想吃的餐廳"),
    h("p", { class: "lead" }, "填好店名和想吃的那一餐，再依位置排進最順路的一天。"),
    h("ul", { class: "list" },
      TRIP.restaurants.map(r => r.blank
        ? h("li", { class: "blank" }, h("span", { class: "slot" }, "自己填：店名、地點、想吃的那一餐"))
        : h("li", null,
            h("p", { class: "a" }, r.name, r.map && h("a", { class: "maplink", href: mapUrl(r.map), target: "_blank", rel: "noopener" }, "地圖")),
            h("p", null, `${r.where}；${r.hours}`),
            h("p", null, r.plan),
            r.note && h("p", { class: "m" }, r.note)))));
}

function renderHotels() {
  return h("section", { class: "block", id: "hotels", "aria-labelledby": "hotels-h" },
    h("h2", { id: "hotels-h" }, "住宿"),
    h("ul", { class: "list" },
      TRIP.hotels.map(x => h("li", null,
        h("p", { class: "a" }, x.name, h("a", { class: "maplink", href: mapUrl(x.map), target: "_blank", rel: "noopener" }, "地圖")),
        h("p", null, `${x.nights}；${x.addr}`),
        h("p", { class: "m" }, x.tip)))));
}

function renderNotes() {
  return h("section", { class: "block", id: "notes", "aria-labelledby": "notes-h" },
    h("h2", { id: "notes-h" }, "出發前要知道"),
    h("ul", { class: "notes" }, TRIP.notes.map(n => h("li", null, n))),
    h("h3", null, "資料來源（2026 年 10 月查詢）"),
    h("ol", { class: "src" }, TRIP.sources.map(([t, u]) => h("li", null, h("a", { href: u, target: "_blank", rel: "noopener" }, t)))));
}

function renderFooter() {
  return h("footer", null,
    h("h2", null, "怎麼修改這一頁"),
    h("p", null, "用文字編輯器或 GitHub 網頁版打開 ", h("code", null, "index.html"), "，所有行程都在檔案上方的 ", h("code", null, "TRIP"), " 資料裡。"),
    h("p", null, "虛線的「自己填」格子：補上 ", h("code", null, "what"), "，再把 ", h("code", null, "tag"), " 改成「指定」。交通費改 ", h("code", null, "cost"), " 裡的 ", h("code", null, "yen"), "，每日小計和總額會自動重算。"));
}

(function render() {
  const today = todayInJapan();
  const app = document.getElementById("app");
  app.replaceChildren(
    renderHero(today),
    renderLegend(),
    renderQuick(),
    renderExcursion(),
    ...TRIP.days.map((d, i) => renderDay(d, i, today)),
    renderBudget(),
    renderRestaurants(),
    renderHotels(),
    renderNotes(),
    renderFooter()
  );
  const cur = TRIP.days.findIndex(d => d.date === today);
  if (cur >= 0) {
    document.body.append(h("a", { class: "today-jump", href: "#" + TRIP.days[cur].id }, `今天：D${cur + 1} ${TRIP.days[cur].short}`));
  }
})();
</script>
