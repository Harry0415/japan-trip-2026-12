<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東京・富士・箱根 九日｜2026/12/21–12/29</title>
<meta name="description" content="2026 年 12 月日本九日行程：成田、淺草、河口湖、御殿場、箱根、川越的每日時間表、交通花費，以及旅伴一起新增的行程與餐廳。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F7F5; --surface:#FFFFFF; --ink:#1C2A39; --mist:#5B6875; --rule:#D3DAD7;
  --ticket:#E2F0E6; --ticket-line:#D3E7DA; --ticket-edge:#9CC3A8; --stamp:#C23B22;
  --ic:#2E8754; --buy:#B07A0C; --pass:#1E5DA6; --free:#8A949E; --focus:#1E5DA6; --on-stamp:#FFFFFF;
  --shadow:0 2px 10px rgba(28,42,57,.14);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#10161C; --surface:#161E26; --ink:#E3EAEE; --mist:#9AA7B2; --rule:#2B353F;
    --ticket:#1A2A21; --ticket-line:#203328; --ticket-edge:#3F6A4F; --stamp:#E7735C;
    --ic:#52B57D; --buy:#D9A440; --pass:#6EA2E2; --free:#7F8A94; --focus:#6EA2E2; --on-stamp:#10161C;
    --shadow:0 2px 12px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.75}
a{color:var(--pass);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.3}
[hidden]{display:none !important}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--mist)}
.warn{color:var(--stamp)}

/* 封面與索引 */
.top{padding:48px 0 0}
.top h1{margin:0;font-size:clamp(30px,8.4vw,56px);line-height:1.12;font-weight:900;letter-spacing:.05em}
.top h1 span,.top .dates span{white-space:nowrap}
.dates{margin:14px 0 0;font-size:20px;font-weight:500}
.base{margin:2px 0 0;color:var(--mist)}
.countdown{margin:8px 0 0;font-size:15px;color:var(--mist)}
.index{margin-top:28px;padding-top:18px;border-top:1px solid var(--rule)}
.index h2{margin:0 0 12px;font-size:16px;font-weight:700;color:var(--mist)}
.idx{list-style:none;margin:0;padding:0}
.idx>li{position:relative;padding:0 0 14px 30px}
.idx>li::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:3px;background:var(--ink)}
.idx>li:first-child::before{top:12px}
.idx>li:last-child::before{bottom:auto;height:12px}
.idx>li::after{content:"";position:absolute;left:1px;top:5px;width:15px;height:15px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}
.idx>li.cost::after{border-color:var(--buy)}
.idx>li.glabel{padding-bottom:10px;font-size:14px;font-weight:700;color:var(--mist)}
.idx>li.glabel::before{background:repeating-linear-gradient(var(--ink) 0 4px,transparent 4px 8px)}
.idx>li.glabel::after{display:none}
.idx a{font-size:17px;font-weight:700}
.idx-desc{margin-left:10px;font-size:14px;color:var(--mist)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.chips a{display:inline-block;padding:2px 11px;border:1px solid var(--rule);border-radius:999px;background:var(--surface);color:var(--ink);font-size:14px;font-weight:400;text-decoration:none}
.chips a b{margin-right:4px}
.chips a.out{border-color:var(--buy)}
.chips a.is-today{border-color:var(--stamp);box-shadow:0 0 0 1px var(--stamp)}
.chips a:hover{background:var(--paper)}

/* 每日行程：路線選站 */
.days{margin-top:64px}
.days-head h2{margin:0;font-size:clamp(24px,5vw,30px);font-weight:900;letter-spacing:.06em}
.hint{margin:6px 0 0;color:var(--mist);font-size:15px}
.legend{margin:6px 0 0;font-size:14px}
.legend summary{cursor:pointer;color:var(--pass);width:max-content}
.legend-body{display:flex;flex-wrap:wrap;gap:6px 20px;padding:8px 0 0;color:var(--mist)}
.legend-body span{display:inline-flex;align-items:center;gap:7px}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c)}
.sw.ring{background:var(--surface);border:3px solid var(--buy)}
.sw.tk{width:22px;height:14px;border-radius:3px;background:var(--ticket);border:1px solid var(--ticket-edge)}
.sw.dash{width:22px;height:14px;border-radius:3px;border:1.5px dashed var(--mist)}
.picker{position:sticky;top:0;z-index:20;margin-top:14px;background:var(--paper);border-bottom:1px solid var(--rule)}
.picker-inner{display:grid;grid-template-columns:38px 1fr 38px;align-items:start;gap:6px;max-width:800px;margin:0 auto;padding:10px 20px 6px}
.pbtn{width:38px;height:38px;margin-top:-6px;border-radius:50%;border:1px solid var(--rule);background:var(--surface);cursor:pointer;font-size:13px;line-height:1}
.pbtn:disabled{opacity:.35;cursor:default}
.track{position:relative}
.track::before{content:"";position:absolute;left:calc(100% / 18);right:calc(100% / 18);top:10px;height:3px;background:var(--ink);transform-origin:left center}
.stops{position:relative;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(9,1fr)}
.stop{display:flex;flex-direction:column;align-items:center;width:100%;padding:4px 0 2px;border:0;border-radius:6px;background:none;cursor:pointer}
.stop .dot{position:relative;width:15px;height:15px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}
.stop.out .dot{border-color:var(--buy)}
.stop.is-today .dot{background:var(--stamp);border-color:var(--stamp)}
.stop .d{margin-top:3px;font-size:13px;font-weight:700;line-height:1.3}
.stop .pl{padding:0 2px;font-size:13px;line-height:1.35;color:var(--mist);text-align:center;word-break:keep-all}
.stop[aria-current="true"] .d,.stop[aria-current="true"] .pl{color:var(--stamp)}
.train{position:absolute;top:2px;left:calc(100% / 18);width:30px;height:18px;margin-left:-15px;border-radius:9px 9px 5px 5px;background:var(--stamp);box-shadow:var(--shadow);pointer-events:none}
.train::before{content:"";position:absolute;left:6px;right:6px;top:4px;height:5px;border-radius:2px;background:var(--on-stamp);opacity:.9}
@media (max-width:640px){
  .stop .pl{display:none}
  .picker-inner{grid-template-columns:34px 1fr 34px;padding:8px 12px 4px}
  .pbtn{width:34px;height:34px;margin-top:-5px}
}

/* 每日行程：橫向卷軸 */
.scroller{--pw:min(720px,calc(100vw - 56px));--gap:20px;display:flex;align-items:flex-start;gap:var(--gap);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;padding-top:18px;padding-bottom:22px;padding-left:max(20px,(100% - 720px) / 2);padding-right:calc(100% - var(--pw) - max(20px,(100% - 720px) / 2));scroll-padding-left:max(20px,(100% - 720px) / 2);scrollbar-width:thin;scrollbar-color:var(--mist) transparent}
@media (max-width:640px){.scroller{--gap:12px}}
.scroller:focus-visible{outline-offset:-3px}
.panel{position:relative;flex:0 0 var(--pw);scroll-snap-align:start;scroll-snap-stop:always;scroll-margin-top:100px;background:var(--surface);border:1px solid var(--rule);border-radius:6px;overflow:hidden;--notch:var(--surface)}
.js .panel:not(.is-active){opacity:.5;cursor:pointer}
.panel.is-today{border-color:var(--stamp);box-shadow:0 0 0 2px var(--stamp)}
.panel-body{padding:2px 20px 22px}
@media (max-width:520px){.panel-body{padding:2px 14px 18px}}

/* 站名牌 */
.sign-main{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px 16px;padding:18px 20px 14px}
.badge{display:grid;place-items:center;align-content:center;width:54px;height:54px;border:3px solid var(--ink);border-radius:12px;line-height:1}
.badge small{font-size:13px;font-weight:700}
.badge b{margin-top:1px;font-size:24px;font-weight:900}
.panel.out .badge{border-color:var(--buy)}
.sign h3{margin:0;font-size:clamp(26px,6vw,36px);font-weight:900;letter-spacing:.08em;line-height:1.15}
.sign-date{grid-column:2;color:var(--mist);font-size:15px}
.today-tag{display:inline-block;margin-left:8px;padding:0 8px;border-radius:999px;background:var(--stamp);color:var(--on-stamp);font-size:12px;font-weight:700;vertical-align:1px}
.sign-band{display:flex;justify-content:space-between;gap:16px;padding:6px 16px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:500}
.sign-band button{padding:0;border:0;background:none;color:inherit;font-weight:500;cursor:pointer}
.sign-band button:hover{text-decoration:underline;text-underline-offset:3px}
.sign-band button:focus-visible{outline-color:var(--paper)}
.sign-band .prev::before{content:"◀\00a0"}
.sign-band .next::after{content:"\00a0▶"}

/* 卡片內容 */
.lead{margin:16px 0 0;font-size:17px}
.panel h4{margin:0;font-size:15px;font-weight:700}
.points{margin:16px 0 0;padding:12px 16px 10px;background:var(--paper);border-radius:6px}
.points ul{list-style:none;margin:6px 0 0;padding:0}
.points li{display:flex;gap:10px;align-items:baseline;padding:4px 0;font-size:15px;line-height:1.6}
.pt-time{flex:none;width:54px;font-family:"DotGothic16","Noto Sans TC",monospace;font-size:18px;line-height:1.2;color:var(--stamp)}
.pt-mark{flex:none;width:54px;align-self:stretch;position:relative}
.pt-mark::before{content:"";position:absolute;left:4px;top:.7em;width:7px;height:7px;border-radius:50%;background:var(--mist)}
.points.plain .pt-mark{width:12px}
.nw{white-space:nowrap}
.need{display:inline-block;margin-left:8px;padding:0 7px;border:1px solid currentColor;border-radius:999px;font-size:12px;line-height:1.6;white-space:nowrap;vertical-align:1px}
.n-book{color:var(--stamp)}
.n-pass{color:var(--pass)}
.n-ic{color:var(--ic)}
.sub{margin:22px 0 0 !important}
.plan{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--rule)}
.plan>li{display:grid;grid-template-columns:100px 1fr;gap:2px 16px;padding:12px 0;border-bottom:1px solid var(--rule)}
.time{padding-top:1px;color:var(--mist);font-size:15px;font-variant-numeric:tabular-nums}
.what{margin:0}
.chip{display:inline-block;margin-left:8px;padding:0 8px;border:1px solid var(--rule);border-radius:999px;font-size:12px;line-height:1.75;color:var(--mist);vertical-align:2px;white-space:nowrap}
.note{margin:2px 0 0;font-size:14px;color:var(--mist)}
.maplink{margin-left:8px;font-size:14px;white-space:nowrap}
.slot{display:block;padding:5px 12px;border:1.5px dashed var(--rule);border-radius:4px;color:var(--mist);font-size:15px}
.ride .what::before{content:"";display:inline-block;width:10px;height:10px;margin-right:9px;border-radius:2px;background:var(--c,var(--ink));vertical-align:1px}
.ride .route-txt{font-weight:500}
.plan>li.ticket-row{display:block;padding:14px 0}
@media (max-width:520px){
  .plan>li{grid-template-columns:66px 1fr;gap:2px 10px}
  .time{font-size:14px}
}

/* 車票 */
.ticket{display:grid;grid-template-columns:1fr 116px;border:1px solid var(--ticket-edge);border-radius:6px;background-color:var(--ticket);background-image:repeating-linear-gradient(-45deg,transparent 0 9px,var(--ticket-line) 9px 10px)}
.t-main{min-width:0;padding:14px 18px 15px}
.t-route{font-size:17px;font-weight:700;letter-spacing:.04em}
.t-route .to{margin:0 8px;color:var(--mist);font-weight:400}
.t-times{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin:4px 0 2px;font-family:"DotGothic16","Noto Sans TC",monospace;font-size:40px;line-height:1.15;letter-spacing:.02em}
.t-times small{margin-right:6px;font-family:"Noto Sans TC",sans-serif;font-size:14px;color:var(--mist);letter-spacing:0}
.t-times small.after{margin:0 0 0 6px}
.t-name{font-size:15px;font-weight:500}
.t-check{margin-top:4px;font-size:13px;color:var(--mist)}
.t-stub{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px 6px;border-left:2px dashed var(--ticket-edge)}
.t-stub::before,.t-stub::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--notch,var(--paper))}
.t-stub::before{top:-9px}
.t-stub::after{bottom:-9px}
.t-price{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.t-price small{display:block;font-size:12px;font-weight:400;color:var(--mist)}
.stamp{display:grid;place-items:center;width:62px;height:62px;border:2px solid var(--sc);border-radius:50%;color:var(--sc);font-size:13px;font-weight:900;letter-spacing:.05em;transform:rotate(-10deg)}
@media (max-width:560px){
  .ticket{grid-template-columns:1fr}
  .t-main{padding:12px 14px 12px}
  .t-times{font-size:32px}
  .t-stub{flex-direction:row;justify-content:space-between;padding:8px 14px;border-left:0;border-top:2px dashed var(--ticket-edge)}
  .t-stub::before,.t-stub::after{top:-9px;bottom:auto}
  .t-stub::before{left:-9px}
  .t-stub::after{left:auto;right:-9px}
  .t-price small{display:inline;margin-left:6px}
  .stamp{width:50px;height:50px;font-size:12px}
}

/* 當天交通 */
.costs{margin-top:22px;padding:16px 18px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:4px}
.panel .costs{background:var(--paper);border:0;border-radius:6px}
.costs h4,.costs h3{margin:0 0 4px;font-size:16px}
.cost{list-style:none;margin:0;padding:0}
.cost li{display:grid;grid-template-columns:1fr auto;gap:0 16px;padding:9px 0;border-bottom:1px dashed var(--rule)}
.cost .leg{font-weight:500}
.cost .leg::before{content:"";display:inline-block;width:10px;height:10px;margin-right:8px;border-radius:50%;background:var(--c);vertical-align:1px}
.cost .how{grid-column:1;font-size:14px;color:var(--mist)}
.cost .amt{grid-column:2;grid-row:1 / span 2;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.cost .amt small{display:block;font-size:12px;font-weight:400;color:var(--mist)}
.sum{display:flex;justify-content:space-between;gap:16px;padding-top:10px;font-weight:700;font-variant-numeric:tabular-nums}
.extra,.cost-note{margin:8px 0 0;font-size:14px;color:var(--mist)}

/* 每天的「大家加的」 */
.mine{margin-top:22px}
.mine p{margin:6px 0 0;font-size:15px}
.mine-list{list-style:none;margin:8px 0 0;padding:0}
.mine-list li{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;padding:7px 0;border-bottom:1px dashed var(--rule);font-size:15px}
.mine-list .by{font-size:13px;color:var(--mist)}
.linkbtn{margin-top:8px;padding:0;border:0;background:none;color:var(--pass);font-size:15px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.kind{display:inline-block;padding:0 8px;border:1px solid currentColor;border-radius:999px;font-size:12px;line-height:1.7;white-space:nowrap}
.kind.plan{color:var(--pass)}
.kind.food{color:var(--buy)}
.etime{color:var(--mist);font-variant-numeric:tabular-nums}

/* 區塊 */
.block{margin-top:88px;scroll-margin-top:12px}
.block>h2{margin:0;font-size:clamp(24px,5vw,30px);font-weight:900;letter-spacing:.06em}
.block>.lead{margin-top:10px}
.block h3{margin:36px 0 8px;font-size:18px}
.group-start{display:flex;align-items:center;gap:14px;margin-top:104px;color:var(--mist);font-size:15px;font-weight:700}
.group-start::after{content:"";flex:1;height:1px;background:var(--rule)}
.group-start+.block{margin-top:28px}

/* 大家加的行程與餐廳 */
.auth{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:18px;padding:14px 16px;background:var(--surface);border:1px solid var(--rule);border-radius:6px}
.auth p{margin:0}
.auth .grow{flex:1 1 220px}
.btn{padding:8px 18px;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:var(--paper);font-size:15px;font-weight:700;cursor:pointer;line-height:1.4}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:3px 12px;font-size:14px;font-weight:500}
.btn.danger{border-color:var(--stamp);background:transparent;color:var(--stamp)}
.btn.danger.armed{background:var(--stamp);color:var(--on-stamp)}
.uid{flex-basis:100%;font-size:14px}
.uid summary{cursor:pointer;color:var(--mist);width:max-content}
.uid code{display:inline-block;margin:6px 8px 0 0;padding:2px 6px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);font-size:13px;word-break:break-all}
.form{display:grid;gap:14px;margin-top:14px;padding:18px;background:var(--surface);border:1px solid var(--rule);border-radius:6px;scroll-margin-top:16px}
.form.editing{border-color:var(--pass);box-shadow:0 0 0 1px var(--pass)}
.form-title{margin:0;font-size:16px;font-weight:700}
.field{margin:0;padding:0;border:0;min-width:0}
.field>label,.field>legend{display:block;margin-bottom:4px;padding:0;font-size:14px;font-weight:700}
.field input[type=text],.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);font-size:16px}
.field textarea{resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:block;padding:5px 18px;font-size:15px}
.seg input:checked+span{background:var(--ink);color:var(--paper)}
.seg input:focus-visible+span{outline:3px solid var(--focus);outline-offset:-3px}
.form-err{margin:0;color:var(--stamp);font-size:15px}
.form-err:empty{display:none}
.form-acts{display:flex;flex-wrap:wrap;gap:10px}
.filters{display:flex;gap:8px;margin-top:24px}
.fbtn{padding:4px 14px;border:1px solid var(--rule);border-radius:999px;background:var(--surface);font-size:14px;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.egroup h3{margin:24px 0 4px;font-size:15px;color:var(--mist)}
.entries{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.entry{padding:12px 0;border-bottom:1px solid var(--rule)}
.ehead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.entry p{margin:2px 0 0}
.eplace{font-size:14px;color:var(--mist)}
.enote{font-size:15px;white-space:pre-wrap}
.entry .by{font-size:13px;color:var(--mist)}
.acts{display:flex;gap:8px;margin-top:8px}

/* 富士・箱根路線圖 */
.route{list-style:none;margin:20px 0 0;padding:0}
.route li{display:grid;grid-template-columns:96px 28px 1fr;column-gap:12px}
.route .rt{padding-top:1px;text-align:right;color:var(--mist);font-size:15px;font-variant-numeric:tabular-nums}
.route .rl{position:relative}
.route .rl::before{content:"";position:absolute;left:12px;top:16px;bottom:-4px;width:5px;background:var(--seg,transparent)}
.route .rl::after{content:"";position:absolute;left:6px;top:6px;width:17px;height:17px;border:3px solid var(--ink);border-radius:50%;background:var(--surface)}
.route li.stay .rl::after{border-radius:3px;background:var(--ink)}
.route li.key .rl::after{border-color:var(--stamp)}
.route .rn{padding:0 0 16px}
.route .rv{display:block;font-size:14px;color:var(--mist)}
.route li.dayhead{display:block;margin:6px 0 10px;padding-left:148px;font-size:14px;font-weight:700;color:var(--mist)}
@media (max-width:480px){
  .route li{grid-template-columns:62px 26px 1fr;column-gap:10px}
  .route li.dayhead{padding-left:108px}
}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.rows li{display:grid;grid-template-columns:1fr auto;gap:0 16px;padding:11px 0;border-bottom:1px solid var(--rule)}
.rows .a{font-weight:700}
.rows .b{grid-column:1;font-size:14px;color:var(--mist)}
.rows .c{grid-column:2;grid-row:1 / span 2;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.why{margin:14px 0 0}

/* 清單與表格 */
.check{list-style:none;margin:0;padding:0}
.check li{border-bottom:1px solid var(--rule)}
.check label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer}
.check input{flex:none;width:20px;height:20px;margin:3px 0 0;accent-color:var(--ic)}
.check input:checked+span{color:var(--mist);text-decoration:line-through}
.tz{margin:8px 0 0;font-size:14px;color:var(--mist)}
.budget{width:100%;margin-top:16px;border-collapse:collapse;font-variant-numeric:tabular-nums}
.budget th,.budget td{padding:9px 6px;border-bottom:1px solid var(--rule);font-weight:400;text-align:left}
.budget td:last-child,.budget th:last-child{text-align:right}
.budget thead th{font-size:14px;color:var(--mist)}
.budget tfoot td{border-top:2px solid var(--ink);border-bottom:0;font-weight:700}
.list{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--rule)}
.list li{padding:14px 0;border-bottom:1px solid var(--rule)}
.list .a{margin:0;font-weight:700}
.list p{margin:2px 0 0;font-size:15px}
.list .m{font-size:14px;color:var(--mist)}
.notes{margin:12px 0 0;padding-left:1.2em}
.notes li{margin:6px 0}
.src{margin:12px 0 0;padding-left:1.4em;font-size:14px}
.src li{margin:4px 0}
footer{margin-top:80px;padding-top:24px;padding-bottom:96px;border-top:1px solid var(--rule);font-size:15px;color:var(--mist)}
footer h2{margin:0 0 8px;font-size:18px;color:var(--ink)}
footer code{padding:0 5px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);font-size:14px}

/* 浮動按鈕與提示 */
.fabs{position:fixed;right:16px;bottom:16px;z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.fab{display:inline-block;padding:9px 16px;border:1px solid var(--rule);border-radius:999px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-size:15px;font-weight:700;text-decoration:none}
.fab.today{border-color:var(--stamp);background:var(--stamp);color:var(--on-stamp)}
.fab.hide{opacity:0;transform:translateY(8px);pointer-events:none}
.toast{position:fixed;left:50%;bottom:24px;z-index:50;max-width:calc(100vw - 32px);padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:15px;opacity:0;transform:translate(-50%,24px);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 動畫：只在使用者沒有要求減少動態時播放 */
@keyframes stamp{0%{opacity:0;transform:scale(1.8) rotate(-24deg)}60%{opacity:1;transform:scale(.94) rotate(-8deg)}100%{opacity:1;transform:scale(1) rotate(-10deg)}}
@media (prefers-reduced-motion: no-preference){
  .js .track:not(.drawn)::before{transform:scaleX(0)}
  .track.drawn::before{transition:transform .8s cubic-bezier(.6,0,.2,1)}
  .js .track:not(.drawn) .dot{transform:scale(0)}
  .track.intro .dot{transition:transform .35s cubic-bezier(.3,1.6,.5,1) calc(var(--k) * 55ms + .1s)}
  .js .track:not(.drawn) .train{opacity:0;left:calc(100% / 18) !important}
  .train{transition:left .5s cubic-bezier(.5,0,.2,1)}
  .track.intro .train{transition:left 1s cubic-bezier(.5,0,.2,1) .55s,opacity .2s .5s}
  .js .panel:not(.stamped) .stamp{opacity:0}
  .panel.stamped .stamp{animation:stamp .45s cubic-bezier(.3,.7,.4,1) both}
  .panel{transition:opacity .3s ease}
  .scroller{transition:height .35s ease}
  .fab{transition:opacity .2s ease,transform .2s ease}
  .toast{transition:opacity .25s ease,transform .25s ease}
}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}

@media print{
  body{background:#fff}
  .picker,.fabs,.toast,.auth,.form,.filters,.legend{display:none !important}
  .scroller{display:block;height:auto !important;overflow:visible;padding:0 20px}
  .panel{margin:0 0 24px;opacity:1 !important}
}

/* 橫向卷軸：路線上的列車跟著目前的日期移動 */
function initDays(today) {
  const scroller = $(".scroller");
  const panels = $$(".panel", scroller);
  const stops = $$(".stop");
  const track = $(".track"), train = $(".train"), picker = $(".picker");
  const prevBtn = $(".pbtn.prev"), nextBtn = $(".pbtn.next"), status = $("#day-status");
  let active = -1, step = 1, settleTimer = 0, raf = 0, interacted = false, lastSettled = -1, inView = false;
  const ro = "ResizeObserver" in window ? new ResizeObserver(() => fit()) : null;

  function measure() {
    step = panels.length > 1 ? panels[1].offsetLeft - panels[0].offsetLeft : scroller.clientWidth || 1;
  }
  function nearest() {
    return Math.max(0, Math.min(panels.length - 1, Math.round(scroller.scrollLeft / step)));
  }
  function fit() {
    const p = panels[active];
    if (!p) return;
    const cs = getComputedStyle(scroller);
    const extra = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + (scroller.offsetHeight - scroller.clientHeight);
    scroller.style.height = Math.ceil(p.offsetHeight + extra) + "px";
  }
  function stamp(i) {
    const p = panels[i];
    if (p && inView && !p.classList.contains("stamped")) setTimeout(() => p.classList.add("stamped"), REDUCE ? 0 : 140);
  }
  function setActive(i) {
    if (i === active) return;
    active = i;
    panels.forEach((p, k) => p.classList.toggle("is-active", k === i));
    stops.forEach((b, k) => b.setAttribute("aria-current", k === i ? "true" : "false"));
    train.style.left = ((i + 0.5) / panels.length * 100) + "%";
    prevBtn.disabled = i === 0;
    nextBtn.disabled = i === panels.length - 1;
    stamp(i);
    fit();
    if (ro) { ro.disconnect(); ro.observe(panels[i]); }
  }
  function announce(i) {
    const d = TRIP.days[i];
    status.textContent = `D${i + 1} ${shortDate(d.date)} ${d.sign}`;
  }
  function pageToPanel() {
    const top = scroller.getBoundingClientRect().top + window.scrollY - picker.offsetHeight;
    window.scrollTo({ top, behavior: REDUCE ? "auto" : "smooth" });
  }
  function go(i, opts) {
    opts = opts || {};
    i = Math.max(0, Math.min(panels.length - 1, i));
    measure();
    interacted = true;
    scroller.scrollTo({ left: i * step, behavior: REDUCE || opts.instant ? "auto" : "smooth" });
    setActive(i);
    announce(i);
    if (opts.page) pageToPanel();
  }
  function settle() {
    const i = nearest();
    setActive(i);
    if (i !== lastSettled) {
      announce(i);
      if (interacted) {
        try { history.replaceState(null, "", "#" + TRIP.days[i].id); } catch (e) {}
        if (scroller.getBoundingClientRect().top < picker.offsetHeight - 40) pageToPanel();
      }
      lastSettled = i;
    }
  }

  scroller.addEventListener("scroll", () => {
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; setActive(nearest()); });
    clearTimeout(settleTimer);
    settleTimer = setTimeout(settle, 150);
  }, { passive: true });
  scroller.addEventListener("pointerdown", () => { interacted = true; }, { passive: true });
  scroller.addEventListener("touchstart", () => { interacted = true; }, { passive: true });
  scroller.addEventListener("wheel", () => { interacted = true; }, { passive: true });
  scroller.addEventListener("keydown", e => {
    if (e.target !== scroller) return;
    if (e.key === "ArrowRight") { e.preventDefault(); go(active + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(active - 1); }
  });
  scroller.addEventListener("click", e => {
    const goBtn = e.target.closest("[data-go]");
    if (goBtn) { go(Number(goBtn.dataset.go)); return; }
    const p = e.target.closest(".panel");
    if (p && !p.classList.contains("is-active")) { e.preventDefault(); e.stopPropagation(); go(Number(p.dataset.i)); }
  }, true);
  prevBtn.addEventListener("click", () => go(active - 1));
  nextBtn.addEventListener("click", () => go(active + 1));
  stops.forEach((b, k) => b.addEventListener("click", () => go(k)));

  /* 頁面上所有 #d1–#d9 的連結都改成切換卡片 */
  document.addEventListener("click", e => {
    const a = e.target.closest("a[href^='#d']");
    if (!a) return;
    const i = TRIP.days.findIndex(d => "#" + d.id === a.getAttribute("href"));
    if (i < 0) return;
    e.preventDefault();
    go(i, { page: true });
    try { history.replaceState(null, "", "#" + TRIP.days[i].id); } catch (err) {}
  });

  let resizeTimer = 0;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { measure(); scroller.scrollLeft = active * step; fit(); }, 120);
  });

  /* 初始位置：網址指定的那天，旅行期間是今天，其他時候是 D1 */
  measure();
  const fromHash = TRIP.days.findIndex(d => "#" + d.id === location.hash);
  const ti = TRIP.days.findIndex(d => d.date === today);
  const start = fromHash >= 0 ? fromHash : ti >= 0 ? ti : 0;
  scroller.scrollLeft = start * step;
  setActive(start);
  announce(start);
  lastSettled = start;
  if (fromHash >= 0) setTimeout(pageToPanel, 60);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); scroller.scrollLeft = active * step; fit(); });

  /* 第一次看到路線時：畫線、站點出現、列車開到目前的日期 */
  const draw = () => {
    track.classList.add("drawn", "intro");
    setTimeout(() => track.classList.remove("intro"), 1900);
  };
  if (REDUCE || !("IntersectionObserver" in window)) { draw(); inView = true; stamp(active); }
  else {
    const io1 = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { draw(); io1.disconnect(); } }, { threshold: 0.6 });
    io1.observe(track);
    const io2 = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { inView = true; stamp(active); io2.disconnect(); } }, { threshold: 0.2 });
    io2.observe(scroller);
  }

  return { go, fit, get active() { return active; } };
}

const T = {
  configured: false, backend: null, loadError: "", authReady: false, authError: "",
  user: null, entries: [], listReady: false, listError: "", filter: "all", editing: null, pendingDay: null
};

async function firebaseBackend(cfg) {
  const [appMod, A, F] = await Promise.all([
    import(FIREBASE_SDK + "firebase-app.js"),
    import(FIREBASE_SDK + "firebase-auth.js"),
    import(FIREBASE_SDK + "firebase-firestore.js")
  ]);
  const app = appMod.initializeApp(cfg);
  const auth = A.getAuth(app);
  const db = F.getFirestore(app);
  const col = F.collection(db, "entries");
  return {
    onUser(cb) {
      return A.onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, name: u.displayName || "", email: u.email || "" } : null));
    },
    signIn() {
      const p = new A.GoogleAuthProvider();
      p.setCustomParameters({ prompt: "select_account" });
      return A.signInWithPopup(auth, p);
    },
    signOut() { return A.signOut(auth); },
    watch(onData, onError) {
      return F.onSnapshot(F.query(col, F.orderBy("createdAt")), { includeMetadataChanges: true },
        snap => onData(snap.docs.map(d => Object.assign({ id: d.id }, d.data({ serverTimestamps: "estimate" }))), { fromCache: snap.metadata.fromCache }),
        onError);
    },
    add(data) {
      return F.addDoc(col, Object.assign({}, data, {
        uid: auth.currentUser ? auth.currentUser.uid : "",
        createdAt: F.serverTimestamp(), updatedAt: F.serverTimestamp()
      }));
    },
    update(id, data) { return F.updateDoc(F.doc(db, "entries", id), Object.assign({}, data, { updatedAt: F.serverTimestamp() })); },
    remove(id) { return F.deleteDoc(F.doc(db, "entries", id)); }
  };
}

const ms = t => !t ? 0 : typeof t.toMillis === "function" ? t.toMillis() : typeof t.seconds === "number" ? t.seconds * 1000 : Number(t) || 0;
const timeKey = t => { const m = /(\d{1,2}):(\d{2})/.exec(t || ""); return m ? Number(m[1]) * 60 + Number(m[2]) : 24 * 60 + 1; };
const byTime = (a, b) => timeKey(a.time) - timeKey(b.time) || ms(a.createdAt) - ms(b.createdAt);
const clip = (v, n) => String(v || "").trim().slice(0, n);
const isMine = e => !!(T.user && e.uid === T.user.uid);
const isAdmin = () => !!(T.user && (TRIP.admins || []).includes(T.user.uid));
function norm(e) {
  const s = v => (typeof v === "string" ? v : "");
  return { id: e.id, kind: e.kind === "food" ? "food" : "plan", day: s(e.day), time: s(e.time), title: s(e.title), place: s(e.place),
           note: s(e.note), name: s(e.name), uid: s(e.uid), createdAt: e.createdAt, updatedAt: e.updatedAt };
}
function errText(e) {
  const c = String((e && e.code) || "");
  if (c.includes("permission-denied")) return "沒有權限：只能修改或刪除自己新增的項目。";
  if (c === "auth/popup-blocked") return "登入視窗被瀏覽器擋住了，請允許彈出視窗後再按一次。";
  if (c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request") return "登入視窗已關閉，還沒有登入。";
  if (c === "auth/unauthorized-domain") return "這個網址還沒加進 Firebase 的授權網域，請照 README 設定。";
  if (c === "auth/operation-not-allowed") return "Firebase 還沒開啟 Google 登入，請照 README 設定。";
  if (c === "auth/network-request-failed" || c === "unavailable") return "連不上伺服器，請檢查網路後再試一次。";
  if (c === "not-found") return "這一筆已經被刪除了。";
  return "發生錯誤" + (c ? `（${c}）` : "") + "，請稍後再試。";
}

function setFormError(msg) { $("#t-err").textContent = msg || ""; }

function fillForm(e) {
  $$("input[name='t-kind']").forEach(r => { r.checked = r.value === e.kind; });
  $("#t-day").value = e.day || "";
  $("#t-time").value = e.time || "";
  $("#t-title").value = e.title || "";
  $("#t-place").value = e.place || "";
  $("#t-note").value = e.note || "";
  $("#t-name").value = e.name || $("#t-name").value;
}

function startEdit(e) {
  T.editing = e.id;
  fillForm(e);
  $("#t-form").classList.add("editing");
  $("#t-form-title").textContent = "修改這一筆";
  $("#t-submit").textContent = "儲存修改";
  $("#t-cancel").hidden = false;
  setFormError("");
  $("#t-form").scrollIntoView({ behavior: REDUCE ? "auto" : "smooth", block: "start" });
  setTimeout(() => $("#t-title").focus({ preventScroll: true }), REDUCE ? 0 : 400);
}

function cancelEdit() {
  T.editing = null;
  const form = $("#t-form");
  form.classList.remove("editing");
  $("#t-form-title").textContent = "新增一筆";
  $("#t-submit").textContent = "新增";
  $("#t-cancel").hidden = true;
  ["#t-time", "#t-title", "#t-place", "#t-note"].forEach(s => { $(s).value = ""; });
  setFormError("");
}

async function onSubmit(ev) {
  ev.preventDefault();
  const kind = ($("input[name='t-kind']:checked") || {}).value === "food" ? "food" : "plan";
  const data = {
    kind, day: $("#t-day").value, time: clip($("#t-time").value, 20), title: clip($("#t-title").value, 60),
    place: clip($("#t-place").value, 80), note: clip($("#t-note").value, 300), name: clip($("#t-name").value, 40)
  };
  if (!data.title) { setFormError("請填名稱。"); $("#t-title").focus(); return; }
  if (!data.name) { setFormError("請填顯示名稱。"); $("#t-name").focus(); return; }
  if (T.user) store.set(NICK_KEY + ":" + T.user.uid, data.name);
  const btn = $("#t-submit");
  btn.disabled = true;
  try {
    if (T.editing) {
      await T.backend.update(T.editing, data);
      toast("已儲存修改");
      cancelEdit();
    } else {
      await T.backend.add(data);
      toast("已新增");
      ["#t-time", "#t-title", "#t-place", "#t-note"].forEach(s => { $(s).value = ""; });
      setFormError("");
    }
  } catch (err) {
    setFormError(errText(err));
  } finally {
    btn.disabled = false;
  }
}

function armDelete(btn, e) {
  if (btn.classList.contains("armed")) {
    btn.disabled = true;
    T.backend.remove(e.id).then(() => {
      toast("已刪除");
      if (T.editing === e.id) cancelEdit();
    }, err => { toast(errText(err)); btn.disabled = false; });
    return;
  }
  const label = btn.textContent;
  btn.classList.add("armed");
  btn.textContent = "確定刪除？";
  setTimeout(() => { if (btn.isConnected && !btn.disabled) { btn.classList.remove("armed"); btn.textContent = label; } }, 4000);
}

async function initTogether() {
  const cfg = TRIP.firebase || {};
  T.configured = !!(window.__TRIP_BACKEND__ || (cfg.apiKey && cfg.projectId));
  $("#t-form").addEventListener("submit", onSubmit);
  $("#t-cancel").addEventListener("click", cancelEdit);
  $$(".fbtn").forEach(b => b.addEventListener("click", () => { T.filter = b.dataset.f; renderList(); }));
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-add]");
    if (b) openFormFor(b.dataset.add);
  });
  renderAuth(); renderList(); renderMine();
  if (!T.configured) return;
  try {
    T.backend = window.__TRIP_BACKEND__ ? await window.__TRIP_BACKEND__() : await firebaseBackend(cfg);
  } catch (err) {
    T.loadError = "旅伴新增功能載入失敗，請重新整理再試一次。";
    renderAuth(); renderList(); renderMine();
    return;
  }
  T.backend.onUser(u => {
    const changed = (T.user ? T.user.uid : null) !== (u ? u.uid : null);
    T.user = u; T.authReady = true; T.authError = "";
    if (changed) { cancelEdit(); $("#t-name").value = ""; }
    renderAuth(); syncForm(); renderList();
  });
  T.backend.watch((list, meta) => {
    T.entries = list.map(norm);
    T.listReady = !(meta && meta.fromCache && !list.length);
    T.listError = "";
    renderList(); renderMine();
  }, err => {
    T.listError = errText(err);
    renderList(); renderMine();
  });
}

function initFabs(today) {

  if (ti >= 0) fabs.append(h("a", { class: "fab today", href: "#" + TRIP.days[ti].id }, `今天：D${ti + 1} ${TRIP.days[ti].short}`));
  document.body.append(fabs);
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(es => es.forEach(x => idx.classList.toggle("hide", x.isIntersecting)), { threshold: 0 }).observe($("#index"));
  } else idx.classList.remove("hide");
}

(function start() {
  const today = todayInJapan();
  $("#app").replaceChildren(
    renderTop(today),
    h("main", null,
      renderDays(today),
      h("div", { class: "wrap" },
        renderFood(),
        renderTogether(),
        renderHotels(),
        renderPrep(),
        h("div", { class: "group-start" }, "花費與評估"),
        renderExcursion(),
        renderBudget(),
        renderSources())),
    renderFooter());
  document.body.append(h("div", { class: "toast", role: "status", "aria-live": "polite" }));
  window.__days = initDays(today);
  initFabs(today);
  initTogether();
})();
</script>
